services:
  kartika-app:
    build:
      context: .
      dockerfile: Dockerfile
    image: kartika-audit:latest
    container_name: kartika-audit-platform
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    labels:
      org.opencontainers.image.title: "KARTIKA"
      org.opencontainers.image.description: "Kepatuhan Audit Risiko & Teknologi Informasi Keamanan Aplikasi"
      org.opencontainers.image.version: "1.0.0"
